<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Date Picker Test - Inspora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .form-control:focus { border-color: #007bff; box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3>Task Date Picker Test</h3>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="start_date" class="form-label">Start Date & Time</label>
                                    <input type="datetime-local" class="form-control" id="start_date" name="start_date">
                                    <div class="form-text">When you plan to start this task</div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="due_date" class="form-label">Due Date *</label>
                                    <input type="date" class="form-control" id="due_date" name="due_date" required>
                                    <div class="invalid-feedback">
                                        Please select a due date.
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">Test Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const startDateInput = document.getElementById('start_date');
        const dueDateInput = document.getElementById('due_date');
        
        // Set minimum dates
        const today = new Date().toISOString().split('T')[0];
        dueDateInput.min = today;
        
        // Date validation function
        function validateDates() {
            const startDate = startDateInput.value;
            const dueDate = dueDateInput.value;
            
            if (startDate && dueDate) {
                const startDateTime = new Date(startDate);
                const dueDateOnly = new Date(dueDate);
                
                if (startDateTime > dueDateOnly) {
                    dueDateInput.classList.add('is-invalid');
                    dueDateInput.nextElementSibling.textContent = 'Due date must be after start date';
                } else {
                    dueDateInput.classList.remove('is-invalid');
                    dueDateInput.nextElementSibling.textContent = '';
                }
            }
        }
        
        // Update due date minimum when start date changes
        startDateInput.addEventListener('change', function() {
            if (this.value) {
                const startDate = new Date(this.value);
                const startDateOnly = startDate.toISOString().split('T')[0];
                dueDateInput.min = startDateOnly;
                validateDates();
            }
        });
        
        // Validate when due date changes
        dueDateInput.addEventListener('change', function() {
            validateDates();
        });
        
        // Form validation
        const form = document.querySelector('form');
        form.addEventListener('submit', function(event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        });
    });
    </script>
</body>
</html>
